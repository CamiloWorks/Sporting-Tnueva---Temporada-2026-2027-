<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/escudo-mid.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/marcadorIphone.png">
<!-- CSS principal -->
  <link rel="stylesheet" href="assets/css/style.css">



<title>Sporting Torrenueva · Temporada 2026-27</title>

</head>
<body>
<div class="wrap">

    <div class="club-header">
      <!-- IZQUIERDA: escudo + nombre -->
      <div class="club-info">
        <div class="crest">
          <img src="img/escudo-mid.png" alt="Escudo Sporting Torrenueva">
        </div>
        <div>
          <h1>Sporting Torrenueva</h1>
          <p>2ª Autonómica · Castilla-La Mancha</p>
        </div>
      </div>

      <!-- DERECHA: botón admin -->
      <button id="login-btn" class="login-icon-btn" aria-label="Admin">
        <svg viewBox="0 0 24 24" class="login-icon">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 
                  1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 
                  4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </button>
      
    </div>

  <!-- HERO: próximo partido -->
  <div class="hero" id="hero"></div>
  <!-- Listado completo -->
  <div class="section-header">
  <div>
    <div class="section-title">Todos los partidos</div>
    <div class="section-sub">Temporada 2026-27 · 32 jornadas</div>
  </div>

  <div class="points-widget">
    <span id="points">0</span> pts 
  </div>
</div>

  <div class="filters">
    <button class="pill active" data-filter="all">Todos</button>
    <button class="pill" data-filter="home">En casa</button>
    <button class="pill" data-filter="away">Fuera</button>
  </div>

  <div id="schedule"></div>

  <footer>
    Datos de la temporada 2026-27. El calendario puede sufrir cambios de fecha u hora por parte de la federación.<br>
	by Camilo Madrid 
  </footer>

</div>

<!-- MODAL de detalle del partido -->
  <div id="match-modal" class="modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">×</button>

      <p id="modal-jornada" class="modal-jornada"></p>

      <div class="modal-teams">
        <div class="modal-team">
          <div class="modal-badge" id="modal-home-badge"></div>
          <span id="modal-home-name"></span>
        </div>
        <span class="modal-vs">VS</span>
        <div class="modal-team">
          <div class="modal-badge" id="modal-away-badge"></div>
          <span id="modal-away-name"></span>
        </div>
      </div>

      <h2 id="modal-title" class="visually-hidden"></h2>
      <p id="modal-score"></p>
      <p id="modal-summary"></p>
      <p id="modal-scorers"></p>

<!-- PANEL DE VOTOS EN CONSTRUCCIÓN 
      <div class="modal-votes">
        <p>Para ti, ¿Cómo fue el partido?</p>
        <button class="vote-btn" data-vote="malo">Malo</button>
        <button class="vote-btn" data-vote="normal">Normal</button>
        <button class="vote-btn" data-vote="bueno">Bueno</button>
        <p id="vote-status"></p>
      </div>

      <div id="vote-chart" class="vote-chart"></div>
-->
    </div>
  </div>

<!-- JS -->
<script src="assets/js/load-json.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/admin-access.js"></script>
<script src="assets/js/modal.js"></script>


</body>
</html>
